# One-time, by hand: creates the Steam Workshop item of GryMod Remastered (a NEW item, so the addon has its own subscribers), as a PRIVATE item, and prints its id.
#
#   1. Actions > Create Workshop item > Run workflow, type `create` in the box.
#   2. The id is in the job summary (and in the log). Write it in `GryMod.WSID` (lua/autorun/grymod_shared.lua) and in the repository secret WORKSHOP_ID,
#      and the Workshop page's link in README.md. Edit the item's title, description and pictures on its Steam page; make it public when you decide to.
#   3. Publish a release: it updates this item (release.yml checks that the secret and GryMod.WSID are the same number).
#
# It needs the secrets STEAM_USERNAME and STEAM_VDF of release.yml. It does not use WORKSHOP_ID: an empty id is what makes the action create an item.
# Run it ONCE: running it again creates a second item. The package it uploads is only a placeholder (GryMod.WSID is not the new id yet); nothing is public.
name: Create Workshop item

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type create to confirm that a new Workshop item must be made"
        required: true
      title:
        description: "Title of the new item"
        required: true
        default: "GryMod Remastered"

permissions:
  contents: read

jobs:
  create:
    if: ${{ inputs.confirm == 'create' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install lupa numpy pillow
      - name: Every Lua file parses and the compiled shaders match their sources
        run: |
          python tools/check_lua_syntax.py
          python dev_resources/shaders/check_compiled.py
      - name: Build the Workshop package (a placeholder version)
        run: python tools/prepare_release.py --version 0.0-create --out dist/workshop --workshop
      - uses: gmod-workshop/workshop-upload@8588ccf539eca957904547557454b4dd96bf5fa2 # v1.2.0
        id: upload
        with:
          username: ${{ secrets.STEAM_USERNAME }}
          vdf: ${{ secrets.STEAM_VDF }}
          title: ${{ inputs.title }}
          visibility: private
          changelog: First upload, to create the item.
          folder: dist/workshop
      - name: The new item's id
        env:
          ITEM_ID: ${{ steps.upload.outputs.id }}
        run: |
          echo "Workshop item created (private): $ITEM_ID"
          {
            echo "### Workshop item created (private)"
            echo ""
            echo "id: \`$ITEM_ID\`"
            echo ""
            echo "Write it in \`GryMod.WSID\` (lua/autorun/grymod_shared.lua), in the repository secret \`WORKSHOP_ID\`, and in the Workshop link of README.md."
          } >> "$GITHUB_STEP_SUMMARY"
